# Шаблон: активується лише після перенесення у .github/workflows/ кореня репозиторію.
name: Publish lab reports and Angular lab9

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Angular dependencies
        working-directory: lab/lab9
        run: npm install
      - name: Build Angular
        working-directory: lab/lab9
        run: npm run build
      - uses: actions/configure-pages@v5
      - name: Prepare the entire reports website
        run: |
          mkdir _site
          rsync -a --exclude='.git/' --exclude='.github/' --exclude='node_modules/' --exclude='.angular/' --exclude='out-tsc/' --exclude='_site/' ./ _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
