<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Звіти з лабораторних | Рекунов Вадим</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800;900&family=Manrope:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --yellow:#eee600;
  --yellow-dark:#ddd500;
  --black:#0b0b0b;
  --panel:#151515;
  --muted:#9a9a9a;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:'Unbounded','Arial Black',sans-serif;
  background:var(--black);
  color:#fff;
  min-height:100vh;
  overflow-x:hidden;
}

.ticker{
  background:var(--yellow);
  color:var(--black);
  overflow:hidden;
  white-space:nowrap;
  padding:18px 0;
}
.ticker-track{
  display:inline-flex;
  animation:scroll-left 28s linear infinite;
}
.ticker.reverse .ticker-track{animation-name:scroll-right}
.ticker span{
  font-weight:800;
  font-size:clamp(16px,2vw,24px);
  letter-spacing:.02em;
  text-transform:uppercase;
  padding:0 28px;
  display:inline-flex;
  align-items:center;
  gap:56px;
}
.ticker span::after{
  content:'';
  width:12px;height:12px;
  background:var(--black);
  display:inline-block;
}
@keyframes scroll-left{to{transform:translateX(-50%)}}
@keyframes scroll-right{from{transform:translateX(-50%)}to{transform:translateX(0)}}

.hero{
  position:relative;
  background:
    repeating-linear-gradient(135deg,rgba(255,255,255,.025) 0 2px,transparent 2px 14px),
    var(--black);
}
.eyebrow{
  font-size:13px;
  font-weight:600;
  color:var(--yellow);
  letter-spacing:.14em;
  text-transform:uppercase;
  margin-bottom:22px;
}
h1{
  font-size:clamp(30px,6vw,76px);
  font-weight:900;
  line-height:1.04;
  text-transform:uppercase;
  letter-spacing:-.01em;
}
h1 em{font-style:normal;color:var(--yellow)}
.sub{
  font-family:'Manrope',sans-serif;
  margin-top:26px;
  max-width:560px;
  color:var(--muted);
  font-size:17px;
  line-height:1.6;
}


.nav{
  display:flex;
  align-items:center;
  gap:40px;
  padding:26px 5vw;
  background:transparent;
  color:rgba(255,255,255,.92);
}
.logo{
  font-size:clamp(22px,2.4vw,32px);
  font-weight:900;
  letter-spacing:.01em;
  color:rgba(255,255,255,.95);
  text-decoration:none;
  white-space:nowrap;
}
.nav-text{
  font-size:14px;
  font-weight:400;
  line-height:1.4;
  color:rgba(255,255,255,.85);
}
.nav-right{
  margin-left:auto;
  display:flex;
  align-items:center;
  gap:28px;
}
.nav-link{
  font-size:13px;
  font-weight:600;
  text-transform:uppercase;
  letter-spacing:.06em;
  color:rgba(255,255,255,.9);
  text-decoration:none;
  padding:9px 14px;
  border:1px solid rgba(255,255,255,.35);
  transition:all .2s ease;
}
.nav-link:hover{background:#fff;color:var(--black);border-color:#fff}
.icon{
  display:flex;
  width:34px;height:34px;
  color:rgba(255,255,255,.9);
  transition:color .2s ease,transform .2s ease;
}
.icon:hover{color:var(--yellow);transform:scale(1.08)}
.icon svg{
  width:100%;height:100%;
  fill:none;stroke:currentColor;stroke-width:1.6;
  stroke-linecap:round;stroke-linejoin:round;
}
.hero-body{padding:56px 5vw 64px}
@media(max-width:820px){
  .nav{flex-wrap:wrap;gap:16px 24px;padding:20px}
  .nav-text{order:3;flex-basis:100%}
}


.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
}
.tile{
  position:relative;
  min-height:400px;
  padding:32px;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  gap:20px;
  background:
    repeating-linear-gradient(135deg,rgba(255,255,255,.03) 0 2px,transparent 2px 14px),
    var(--panel);
  border-right:1px solid #262626;
  border-bottom:1px solid #262626;
  transition:background .25s ease,color .25s ease;
  overflow:hidden;
}
.tile::before{
  content:attr(data-n);
  position:absolute;
  top:-20px;right:16px;
  font-size:190px;
  font-weight:900;
  line-height:1;
  color:rgba(255,255,255,.04);
  transition:color .25s ease;
  pointer-events:none;
}
.hex{width:80px;height:80px;flex-shrink:0}
.hex polygon{fill:none;stroke:#fff;stroke-width:5;stroke-linejoin:round;transition:stroke .25s ease}
.hex text{
  fill:#fff;
  font-family:'Unbounded',sans-serif;
  font-weight:800;
  font-size:30px;
  text-anchor:middle;
  dominant-baseline:central;
  transition:fill .25s ease;
}
.tile h2{
  font-size:clamp(18px,1.7vw,24px);
  font-weight:800;
  line-height:1.18;
  text-transform:uppercase;
}
.tile p{
  font-family:'Manrope',sans-serif;
  font-size:14px;
  line-height:1.5;
  color:var(--muted);
  transition:color .25s ease;
}
.links{display:flex;gap:10px;flex-wrap:wrap}
.btn{
  font-family:'Unbounded',sans-serif;
  font-size:11px;
  font-weight:600;
  text-transform:uppercase;
  letter-spacing:.04em;
  text-decoration:none;
  padding:13px 16px;
  border:2px solid var(--yellow);
  color:var(--black);
  background:var(--yellow);
  transition:all .2s ease;
}
.btn.ghost{background:transparent;color:#fff;border-color:#fff}
.btn:hover{background:#fff;border-color:#fff;color:var(--black)}

.tile:hover{background:var(--yellow);color:var(--black)}
.tile:hover::before{color:rgba(0,0,0,.07)}
.tile:hover p{color:rgba(0,0,0,.7)}
.tile:hover .hex polygon{stroke:var(--black)}
.tile:hover .hex text{fill:var(--black)}
.tile:hover .btn{background:var(--black);border-color:var(--black);color:var(--yellow)}
.tile:hover .btn.ghost{background:transparent;color:var(--black)}
.tile:hover .btn:hover{background:#fff;border-color:#fff;color:var(--black)}

footer{
  display:flex;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:10px;
  padding:28px 5vw;
  font-size:12px;
  font-weight:600;
  text-transform:uppercase;
  letter-spacing:.08em;
  color:var(--muted);
}

@media(max-width:980px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:620px){
  .grid{grid-template-columns:1fr}
  .tile{min-height:340px;padding:24px}
  .hero-body{padding:40px 20px 48px}
}
@media(prefers-reduced-motion:reduce){.ticker-track{animation:none}}
</style>
</head>
<body>

<header class="hero">
  <nav class="nav">
    <a class="logo" href="#top">Рекунов Вадим</a>
    <p class="nav-text">Лабораторні роботи<br>з курсу «Веб-програмування»</p>
    <div class="nav-right">
      <a class="icon" href="https://github.com/vrekunov2023/Web_Programming" target="_blank" rel="noopener" aria-label="GitHub">
        <svg viewBox="0 0 24 24"><path d="M9 19c-4.3 1.4-4.3-2.5-6-3m12 5v-3.5c0-1 .1-1.4-.5-2 2.8-.3 5.5-1.4 5.5-6a4.6 4.6 0 0 0-1.3-3.2 4.2 4.2 0 0 0-.1-3.2s-1.1-.3-3.5 1.3a12.3 12.3 0 0 0-6.2 0C6.5 2.8 5.4 3.1 5.4 3.1a4.2 4.2 0 0 0-.1 3.2A4.6 4.6 0 0 0 4 9.5c0 4.6 2.7 5.7 5.5 6-.6.6-.6 1.2-.5 2V21"/></svg>
      </a>
    </div>
  </nav>
</header>

<div class="ticker" aria-hidden="true"><div class="ticker-track" id="t2"></div></div>

<main class="grid" id="grid"></main>

<div class="ticker reverse" aria-hidden="true"><div class="ticker-track" id="t3"></div></div>

<footer>
  <span>Рекунов Вадим</span>
  <span>© 2026</span>
</footer>

<script>
/* ===== ТУТ =====
   report — шлях до звіту на твоєму GitHub Pages
   page   — шлях до самої сторінки лабораторної */
const labs = [
  { title: "Блог «Мої 3 найкращі міста світу»", desc: "HTML та CSS: базова верстка сторінки блогу.",
    report: "lab_1/report.pdf", page: "lab_1/index.html" },
  { title: "Акустична варта — моніторинг шуму", desc: "Адаптивна верстка, Flexbox / Grid, форма й таблиця.",
    report: "lab_2/report.pdf", page: "lab_2/index.html" },
  { title: "Адаптивна верстка та SCSS", desc: "Mobile First, CSS Grid, препроцесор SCSS.",
    report: "lab_3/report.pdf", page: "lab_3/index.html" },
  { title: "Цикли, функції та вирази в JavaScript", desc: "Робота з консоллю DevTools.",
    report: "lab_4/report.pdf", page: "lab_4/index.html" },
  { title: "Проєктування системи класів у JavaScript", desc: "ООП: класи, наслідування, інкапсуляція.",
    report: "lab_5/report.pdf", page: "lab_5/index.html" },
  { title: "Відображення та фільтрація сенсорів у DOM", desc: "querySelector, filter(), динамічний рендер.",
    report: "lab_6/report.pdf", page: "lab_6/index.html" }
];

const word = 'ЗВІТИ';
['t2','t3'].forEach(id => {
  const track = document.getElementById(id);
  for (let i = 0; i < 40; i++) {
    const s = document.createElement('span');
    s.textContent = word;
    track.appendChild(s);
  }
});

const grid = document.getElementById('grid');
labs.forEach((lab, i) => {
  const n = String(i + 1).padStart(2, '0');

  const tile = document.createElement('article');
  tile.className = 'tile';
  tile.dataset.n = n;

  tile.innerHTML =
    '<svg class="hex" viewBox="0 0 100 100" aria-hidden="true">' +
      '<polygon points="50,5 91,28 91,72 50,95 9,72 9,28"/>' +
      '<text x="50" y="52">' + (i + 1) + '</text>' +
    '</svg>';

  const h2 = document.createElement('h2');
  h2.textContent = lab.title;

  const p = document.createElement('p');
  p.textContent = lab.desc;

  const links = document.createElement('div');
  links.className = 'links';

  const a = document.createElement('a');
  a.className = 'btn';
  a.href = lab.report;
  a.textContent = 'Відкрити звіт';

  const b = document.createElement('a');
  b.className = 'btn ghost';
  b.href = lab.page;
  b.textContent = 'Переглянути сторінку';

  links.append(a, b);
  tile.append(h2, p, links);
  grid.appendChild(tile);
});
</script>
</body>
</html>
